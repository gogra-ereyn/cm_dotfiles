[app]
id = 1
name = "demo-app"
host_name = "demo-host"
status = "up"
labels = ["env:test", "service:demo"]

[alert_defaults]
level = "warning"
labels = ["env:test", "service:demo"]

[[alerts]]
title = "disk 80% used"
body = "disk almost full on /var"
