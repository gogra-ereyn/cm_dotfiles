name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y cmake gcc

      - name: build
        run: make BUILD_TYPE=Release

      - name: test
        run: make test

      - name: package
        run: |
          tag="${GITHUB_REF_NAME}"
          staging="cuteils-${tag}-linux-x64"
          mkdir "$staging"
          cp build/bin/* "$staging/"
          tar czf "${staging}.tar.gz" "$staging"

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "cuteils-${tag}-linux-x64.tar.gz"
